# 1360-1800 cm⁻¹ Ground Truth Synth Config

wavenumber:
  min: 1360.0
  max: 1800.0
  step: 1.0

envelope:
  subpeaks_range: [1, 3]
  amplitude_range: [3.0e-05, 1.2e-04]
  lorentz_fwhm_range: [25.0, 38.0]

component_amplitude:
  alpha_helix: [6.0e-05, 1.0e-04]
  beta_sheet:  [4.0e-05, 8.0e-05]
  beta_turn:   [2.0e-05, 5.0e-05]
  other:       [3.0e-05, 7.0e-05]

peak_control:
  total_peaks_range: [15, 24]
  component_peaks:
    alpha_helix: [1, 2]
    beta_sheet: [4, 4]
    beta_turn: [0, 0]
    other: [12, 18]
  validation:
    check_overlap: true
    min_separation: 4.5
    enforce_total: true

broadening:
  lorentz_fwhm_range: [25.0, 30.0]
  gauss_fwhm_range: [1.0, 2.5]
  doppler_fwhm_range: [0.5, 1.5]

noise:
  detector_noise_std: 0.004
  micro_perturbation_std: 0.012

baseline_drift:
  amplitude: 0.020
  period: 250.0
  random_drift_std: 0.010

peaks:
  alpha_helix:
    center: 1659.0
    tolerance: 7.0

  beta_sheet:
    - [1608.0, 6.0]
    - [1622.0, 6.0]
    - [1638.0, 5.0]
    - [1682.0, 7.0]

  beta_turn:
    - [1676.0, 5.0]
    - [1688.0, 5.0]

  other_peaks:
    regions:
      - [1365.0, 1425.0]
      - [1425.0, 1485.0]
      - [1485.0, 1545.0]
      - [1545.0, 1605.0]
    region_weights: [1.0, 3.4, 1.1, 0.9]
    fwhm_range: [25.0, 30.0]
    amplitude_ratio: [0.25, 0.70]

postprocess:
  target_max_amplitude: 1.25e-04

dataset:
  n_samples: 10000
  output_filename: "groundtruth_1360_1800.npz"
  random_seed: 1234
  peak_allocation_strategy: "balanced"
  allow_peak_adjustment: true

visualization:
  style: "seaborn-v0_8"
  palette: "husl"
  figure_size: [14, 10]
  dpi: 100